<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<script>
var _log = function(msg) { console.log('[ARKEA] ' + msg); };
// DEBUG PANEL (commented out - uncomment to show)

// _dbgHdr.innerHTML = '<span>ARKEA DEBUG ▲</span>';

// _dbgLog.style.cssText = 'max-height:150px;overflow-y:auto;';

// _dbg.appendChild(_dbgHdr);

// function log(msg) { var time = new Date().toLocaleTimeString(); _dbgLog.innerHTML = '[' + time + '] ' + msg + '<br>' + _dbgLog.innerHTML; _dbgLog.scrollTop = _dbgLog.scrollHeight; }

var _isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
var _hasOrientation = !!(screen.orientation && screen.orientation.lock);
var _locked = false;
var _lockAttempts = 0;
var _wasInFullscreen = false;

// function log(msg) { var time = new Date().toLocaleTimeString(); _dbgLog.innerHTML = '[' + time + '] ' + msg + '<br>' + _dbgLog.innerHTML; _dbgLog.scrollTop = _dbgLog.scrollHeight; }

_log('Mobile: ' + _isMobile);
_log('API: ' + _hasOrientation);

function tryLockForce() {
    _lockAttempts++;
    if (!_hasOrientation) {
        _log('No orientation API');
        return;
    }
    
    _log('Force lock attempt #' + _lockAttempts);
    
    screen.orientation.lock('landscape').then(function() {
        _locked = true;
        _log('LOCKED to landscape');
    }).catch(function(err) {
        _log('Lock error: ' + err.message);
        _locked = false;
        
        // Try alternative - some browsers support this
        if (screen.orientation.lock && screen.orientation.type === 'portrait-primary') {
            screen.orientation.lock('landscape-primary').then(function() {
                _locked = true;
                _log('Locked landscape-primary');
            }).catch(function(e2) {
                _log('Alt lock failed: ' + e2.message);
            });
        }
    });
}

function tryUnlock() {
    if (_locked && screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
        _locked = false;
        _log('Unlocked orientation');
    }
}

// Listen for messages from parent (Next.js)
window.addEventListener('message', function(e) {
    _log('MSG from parent: ' + e.data);
    
    if (e.data === 'fullscreen-enter') {
        _wasInFullscreen = true;
        tryLockForce();
    } else if (e.data === 'fullscreen-exit') {
        _wasInFullscreen = false;
        tryUnlock();
    }
});

// Use parent message state instead of unreliable document.fullscreenElement
setInterval(function() {
    if (_wasInFullscreen) {
        if (!_locked || (screen.orientation && screen.orientation.type && screen.orientation.type.indexOf('landscape') === -1)) {
            _log('Ensuring landscape lock...');
            tryLockForce();
        }
    }
}, 500);
</script>

		<canvas id="canvas">

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":52367936,"index.wasm":43682606},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
